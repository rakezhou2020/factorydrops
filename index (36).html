<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Factory Drops</title>
<script>
(function(){
 const supported=['en','zh','ja','de','fr','es'];
 const saved=localStorage.getItem('fd_lang');
 let lang=saved || (navigator.language||'en').toLowerCase().split('-')[0];
 if(!supported.includes(lang)) lang='en';
 location.replace('/'+lang+'/');
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=/en/"></noscript>
</head><body></body></html>
